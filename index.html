<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>My Soft Todo List</title>

    <!-- PWA 및 모바일 앱 설정 -->
    <meta
      name="description"
      content="아기자기하고 따뜻한 감성의 나만의 할 일 관리 및 메모 앱"
    />
    <meta name="theme-color" content="#F8F7F0" />

    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 폰트 로드 (Gaegu) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <!-- 아이콘 로드 -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ivory: {
                light: "#FFFFFF",
                DEFAULT: "#F8F7F0",
                dark: "#EFECE1",
              },
              sage: {
                light: "#C5E2C1",
                DEFAULT: "#7B9675",
                dark: "#63725F",
              },
            },
            fontFamily: {
              sans: ['"Gaegu"', "sans-serif"],
            },
          },
        },
      };
    </script>

    <style>
      html,
      body {
        background-color: #f8f7f0;
        color: #63725f;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .app-container::-webkit-scrollbar {
        display: none;
      }
      .app-container {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      input[type="date"]::-webkit-calendar-picker-indicator {
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%2363725F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>');
        cursor: pointer;
        opacity: 0.9;
        width: 18px;
        height: 18px;
        transition: 0.2s;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #8f9e8b;
        border-radius: 10px;
      }

      .task-card {
        transition: all 0.3s ease;
      }
      .task-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(143, 158, 139, 0.25);
      }

      .hide-scroll::-webkit-scrollbar {
        display: none;
      }
      .hide-scroll {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body
    class="font-sans selection:bg-sage-light selection:text-white tracking-tight"
  >
    <!-- 메인 컨테이너 -->
    <div
      class="w-full h-full overflow-y-auto app-container bg-[#F8F7F0] flex flex-col gap-4 pt-5 pb-12 px-4 md:px-8"
    >
      <!-- 날짜 및 응원 문구 -->
      <div
        class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-2 px-1 pb-0.5 w-full justify-start text-left"
      >
        <span
          id="form-date-display"
          class="text-[17px] font-black text-sage-dark shrink-0"
        ></span>
        <div class="flex items-center gap-1">
          <span
            id="form-cheer-display"
            class="text-[14px] font-extrabold text-sage-dark"
          ></span>
          <span
            id="form-cheer-icon"
            class="flex items-center justify-center shrink-0 scale-90"
          ></span>
        </div>
      </div>

      <!-- 할 일 입력 폼 -->
      <form
        id="todo-form"
        class="bg-white/90 backdrop-blur-sm p-4 rounded-[1.75rem] shadow-sm border border-sage-light/15 flex flex-col gap-3.5 shrink-0"
      >
        <!-- 할 일 내용 입력 -->
        <div class="relative">
          <input
            type="text"
            id="task-input"
            placeholder="무엇을 기록할까요?"
            class="w-full bg-white px-4 py-3 rounded-full text-[16px] font-extrabold border border-transparent focus:border-sage focus:outline-none shadow-[0_1px_3px_rgba(99,114,95,0.05)] transition-shadow text-sage-dark placeholder-sage-dark/60"
          />
        </div>

        <div class="flex flex-col gap-3">
          <!-- 카테고리 선택 -->
          <div
            class="flex flex-col md:flex-row gap-2 w-full"
            id="category-selector"
          >
            <!-- 중요하지 않은 할 일 -->
            <label class="cursor-pointer group w-full">
              <input
                type="radio"
                name="category"
                value="want"
                class="peer hidden"
                checked
              />
              <div
                class="px-3 py-2 rounded-full text-[15px] font-extrabold text-sage-dark bg-white border border-sage-light/25 peer-checked:bg-sage peer-checked:text-white peer-checked:border-sage transition-all text-center shadow-[0_1px_2px_rgba(110,139,103,0.02)] hover:border-sage/50 flex justify-center items-center"
              >
                <span>중요하지 않은 할 일 💭</span>
              </div>
            </label>

            <!-- 지금 해야 할 일 -->
            <label class="cursor-pointer group w-full">
              <input
                type="radio"
                name="category"
                value="must"
                class="peer hidden"
              />
              <div
                class="px-3 py-2 rounded-full text-[15px] font-extrabold text-sage-dark bg-white border border-sage-light/25 peer-checked:bg-sage peer-checked:text-white peer-checked:border-sage transition-all text-center shadow-[0_1px_2px_rgba(110,139,103,0.02)] hover:border-sage/50 flex justify-center items-center"
              >
                <span>지금 해야 할 일 🔥</span>
              </div>
            </label>

            <!-- 지금 하지 않아도 되는 할 일 -->
            <label class="cursor-pointer group w-full">
              <input
                type="radio"
                name="category"
                value="trivial"
                class="peer hidden"
              />
              <div
                class="px-3 py-2 rounded-full text-[15px] font-extrabold text-sage-dark bg-white border border-sage-light/25 peer-checked:bg-sage peer-checked:text-white peer-checked:border-sage transition-all text-center shadow-[0_1px_2px_rgba(110,139,103,0.02)] hover:border-sage/50 flex justify-center items-center"
              >
                <span>지금 하지 않아도 되는 할 일 🍃</span>
              </div>
            </label>
          </div>

          <div class="flex gap-3 w-full items-center justify-between">
            <!-- 날짜 선택 -->
            <div id="date-picker-wrapper" class="hidden flex-col flex-1">
              <label
                for="due-date"
                class="text-[13px] text-sage-dark ml-2 mb-1 font-extrabold"
                >언제까지?</label
              >
              <input
                type="date"
                id="due-date"
                class="w-full bg-white px-3.5 py-2 rounded-full text-[15px] font-extrabold border border-sage-light/25 focus:border-sage focus:outline-none text-sage-dark shadow-[0_1px_2px_rgba(99,114,95,0.03)] transition-colors cursor-pointer"
              />
            </div>

            <!-- 추가 버튼 -->
            <button
              type="submit"
              class="bg-sage hover:bg-sage-dark text-white p-2.5 rounded-full shadow-[0_1px_4px_rgba(99,114,95,0.08)] hover:shadow-[0_2px_8px_rgba(99,114,95,0.15)] transition-all flex items-center justify-center self-end h-10 w-10 shrink-0"
            >
              <i data-lucide="plus" class="w-4.5 h-4.5"></i>
            </button>
          </div>
        </div>
      </form>

      <!-- 뷰 전환 탭 -->
      <div class="flex justify-center w-full shrink-0">
        <div
          class="bg-ivory-dark/70 p-1 rounded-full inline-flex gap-1 shadow-inner relative overflow-x-auto hide-scroll max-w-full"
        >
          <button
            id="tab-list"
            class="px-3.5 py-1.5 rounded-full text-[14px] font-extrabold bg-white text-sage-dark shadow-sm transition-all whitespace-nowrap"
          >
            리스트 뷰
          </button>
          <button
            id="tab-weekly"
            class="px-3.5 py-1.5 rounded-full text-[14px] font-extrabold text-sage-dark hover:text-black transition-all whitespace-nowrap"
          >
            주간 달력
          </button>
          <button
            id="tab-monthly"
            class="px-3.5 py-1.5 rounded-full text-[14px] font-extrabold text-sage-dark hover:text-black transition-all whitespace-nowrap"
          >
            월간 달력
          </button>
        </div>
      </div>

      <!-- 이번달 목표 -->
      <div
        id="goal-container"
        class="hidden shrink-0 bg-white/80 backdrop-blur-sm rounded-xl p-2.5 shadow-sm border border-white"
      >
        <div class="flex items-center gap-2">
          <div
            class="w-7 h-7 rounded-full flex items-center justify-center shrink-0"
          >
            <svg
              width="22"
              height="22"
              viewBox="0 0 100 100"
              xmlns="http://www.w3.org/2000/svg"
            >
              <defs>
                <filter
                  id="soft-shadow"
                  x="-20%"
                  y="-20%"
                  width="140%"
                  height="140%"
                >
                  <feDropShadow
                    dx="0"
                    dy="2"
                    stdDeviation="2"
                    flood-color="#6E8B67"
                    flood-opacity="0.65"
                  />
                </filter>
              </defs>
              <path d="M 20 80 Q 50 100 80 80 Q 50 60 20 80 Z" fill="#6E8B67" />
              <g filter="url(#soft-shadow)">
                <circle cx="50" cy="30" r="14" fill="white" />
                <circle cx="68" cy="43" r="14" fill="white" />
                <circle cx="61" cy="63" r="14" fill="white" />
                <circle cx="39" cy="63" r="14" fill="white" />
                <circle cx="32" cy="43" r="14" fill="white" />
              </g>
              <circle cx="50" cy="48" r="10" fill="#FDE047" />
            </svg>
          </div>
          <input
            type="text"
            id="monthly-goal-input"
            placeholder="이곳에 이번 달의 목표를 적어보세요!"
            class="w-full bg-transparent border-none focus:ring-0 focus:outline-none text-sage-dark font-black placeholder-sage-dark/60 text-[14px]"
          />
        </div>
      </div>

      <!-- 주간 달력 뷰 -->
      <div id="view-weekly" class="hidden w-full shrink-0">
        <div
          class="bg-white/80 backdrop-blur-sm rounded-[1.5rem] p-3.5 shadow-sm border border-white"
        >
          <div class="flex justify-between items-center mb-2.5 px-1">
            <button
              id="prev-week"
              class="p-1 text-sage-dark hover:bg-sage-light/30 rounded-full transition"
            >
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <h3
              id="current-week-label"
              class="text-[15px] font-black text-sage-dark"
            ></h3>
            <button
              id="next-week"
              class="p-1 text-sage-dark hover:bg-sage-light/30 rounded-full transition"
            >
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
          <!-- 모바일 스크롤 컨테이너 -->
          <div
            id="weekly-scroll-container"
            class="overflow-x-auto -mx-3.5 px-3.5 hide-scroll w-[calc(100%+1.75rem)] scroll-smooth"
          >
            <div
              class="flex gap-2 justify-start md:justify-center min-w-max pb-1"
              id="weekly-grid"
            >
              <!-- 요일별 컬럼 생성 위치 -->
            </div>
          </div>
        </div>
      </div>

      <!-- 월간 달력 뷰 -->
      <div id="view-monthly" class="hidden w-full shrink-0">
        <div
          class="bg-white/80 backdrop-blur-sm rounded-[1.5rem] p-3.5 shadow-sm border border-white"
        >
          <div class="flex justify-between items-center mb-2.5 px-1">
            <button
              id="prev-month"
              class="p-1 text-sage-dark hover:bg-sage-light/30 rounded-full transition"
            >
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <h3
              id="current-month-label"
              class="text-[15px] font-black text-sage-dark"
            ></h3>
            <button
              id="next-month"
              class="p-1 text-sage-dark hover:bg-sage-light/30 rounded-full transition"
            >
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
          <div class="grid grid-cols-7 gap-1 mb-1">
            <div class="text-center text-[12px] font-black text-red-600">
              일
            </div>
            <div class="text-center text-[12px] font-black text-sage-dark">
              월
            </div>
            <div class="text-center text-[12px] font-black text-sage-dark">
              화
            </div>
            <div class="text-center text-[12px] font-black text-sage-dark">
              수
            </div>
            <div class="text-center text-[12px] font-black text-sage-dark">
              목
            </div>
            <div class="text-center text-[12px] font-black text-sage-dark">
              금
            </div>
            <div class="text-center text-[12px] font-black text-blue-600">
              토
            </div>
          </div>
          <div class="grid grid-cols-7 gap-1" id="monthly-grid">
            <!-- 월간 달력 생성 위치 -->
          </div>
        </div>
      </div>

      <!-- 리스트 영역 -->
      <div
        id="view-list"
        class="flex md:grid md:grid-cols-3 overflow-x-auto md:overflow-visible hide-scroll snap-x snap-mandatory md:snap-none gap-3 md:gap-4 pb-2 -mx-4 md:mx-0 px-4 md:px-0 w-[calc(100%+2rem)] md:w-full shrink-0"
      >
        <!-- 1. 중요하지 않은 할 일 -->
        <div
          class="snap-center shrink-0 w-[85%] md:w-full bg-white/90 backdrop-blur-sm rounded-[1.5rem] p-3.5 shadow-sm border border-sage-light/20 flex flex-col max-h-[50vh] md:max-h-[55vh]"
        >
          <div class="flex items-center gap-2 mb-2.5 shrink-0">
            <div
              class="w-6 h-6 rounded-full bg-sage-light/30 flex items-center justify-center text-[14px]"
            >
              💭
            </div>
            <h2 class="text-[15px] font-black text-sage-dark">
              중요하지 않은 할 일
            </h2>
          </div>
          <div
            id="list-want"
            class="flex flex-col gap-2 overflow-y-auto hide-scroll flex-1 pb-1"
          >
            <!-- Items go here -->
          </div>
        </div>

        <!-- 2. 지금 해야 할 일 -->
        <div
          class="snap-center shrink-0 w-[85%] md:w-full bg-white/90 backdrop-blur-sm rounded-[1.5rem] p-3.5 shadow-sm border border-sage-light/20 flex flex-col max-h-[50vh] md:max-h-[55vh]"
        >
          <div class="flex items-center gap-2 mb-2.5 shrink-0">
            <div
              class="w-6 h-6 rounded-full bg-orange-100 flex items-center justify-center text-[14px]"
            >
              🔥
            </div>
            <h2 class="text-[15px] font-black text-sage-dark">
              지금 해야 할 일
            </h2>
          </div>
          <div
            id="list-must"
            class="flex flex-col gap-2 overflow-y-auto hide-scroll flex-1 pb-1"
          >
            <!-- Items go here -->
          </div>
        </div>

        <!-- 3. 지금 하지 않아도 되는 할 일 -->
        <div
          class="snap-center shrink-0 w-[85%] md:w-full bg-white/90 backdrop-blur-sm rounded-[1.5rem] p-3.5 shadow-sm border border-sage-light/20 flex flex-col max-h-[50vh] md:max-h-[55vh]"
        >
          <div class="flex items-center gap-2 mb-2.5 shrink-0">
            <div
              class="w-6 h-6 rounded-full bg-sage-light/30 flex items-center justify-center text-[14px]"
            >
              🍃
            </div>
            <h2 class="text-[15px] font-black text-sage-dark">
              지금 하지 않아도 되는 할 일
            </h2>
          </div>
          <div
            id="list-trivial"
            class="flex flex-col gap-2 overflow-y-auto hide-scroll flex-1 pb-1"
          >
            <!-- Items go here -->
          </div>
        </div>
      </div>

      <!-- 달력 공통 메모 영역 -->
      <div id="calendar-memos" class="hidden flex-col gap-3 w-full shrink-0">
        <div class="flex items-center justify-between px-1">
          <h3
            id="memo-title"
            class="text-[14px] font-black text-sage-dark"
          ></h3>
        </div>

        <div
          class="flex md:grid md:grid-cols-3 md:gap-4 overflow-x-auto md:overflow-visible hide-scroll snap-x snap-mandatory md:snap-none gap-3 pb-2 -mx-4 md:mx-0 px-4 md:px-0 w-[calc(100%+2rem)] md:w-full"
          id="dynamic-memos"
        >
          <!-- Javascript를 통해 동적으로 렌더링 됨 -->
        </div>

        <!-- 월간 달력에서만 보여지는 '이번 달 주간 메모' -->
        <div
          id="monthly-weekly-memos"
          class="hidden flex-col gap-2 mt-0.5 bg-white/60 p-3.5 rounded-[1.5rem] border border-white shadow-sm"
        >
          <h3
            class="text-[14px] font-black text-sage-dark flex items-center gap-1.5 mb-0.5"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 100 100"
              class="shrink-0"
              style="transform: translateY(-1px)"
            >
              <defs>
                <filter
                  id="soft-shadow-sprout"
                  x="-20%"
                  y="-20%"
                  width="140%"
                  height="140%"
                >
                  <feDropShadow
                    dx="0"
                    dy="2"
                    stdDeviation="2"
                    flood-color="#6E8B67"
                    flood-opacity="0.65"
                  />
                </filter>
              </defs>
              <g filter="url(#soft-shadow-sprout)">
                <path
                  d="M 50 90 L 50 64"
                  stroke="#6E8B67"
                  stroke-width="4"
                  stroke-linecap="round"
                  fill="none"
                />
                <path
                  d="M 50 65 C 20 70 5 55 10 45 C 15 30 40 45 50 65 Z"
                  fill="#84A37F"
                />
                <path
                  d="M 50 65 C 80 70 95 55 90 45 C 85 30 60 45 50 65 Z"
                  fill="#6E8B67"
                />
              </g>
            </svg>
            <span>이번 달 주간 메모</span>
          </h3>
          <div id="monthly-weekly-list" class="flex flex-col gap-2">
            <!-- Javascript를 통해 동적으로 렌더링 됨 -->
          </div>
        </div>
      </div>
    </div>

    <!-- 카테고리 추가 모달 -->
    <div
      id="add-cat-modal"
      class="fixed inset-0 bg-sage-dark/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4"
    >
      <div
        class="bg-ivory-light p-5 rounded-[1.5rem] shadow-2xl max-w-xs w-full relative"
      >
        <button
          id="close-cat-modal"
          class="absolute top-3 right-3 text-sage-dark hover:text-black p-1"
        >
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
        <h3 class="text-[16px] font-black text-sage-dark mb-2.5">
          새 메모 카테고리 추가
        </h3>
        <input
          type="text"
          id="new-cat-input"
          placeholder="카테고리 이름 (예: 아이디어 메모)"
          class="w-full bg-white px-3.5 py-2 rounded-xl border border-sage-light/30 focus:border-sage focus:outline-none text-[13px] text-sage-dark font-bold mb-4 placeholder-sage-dark/60"
        />
        <button
          id="btn-save-cat"
          class="w-full bg-sage hover:bg-sage-dark text-[14px] text-white font-extrabold py-2 rounded-full transition-colors shadow-sm"
        >
          카테고리 생성
        </button>
      </div>
    </div>

    <!-- 일간 일정 확인 팝업 (모달) -->
    <div
      id="daily-modal"
      class="fixed inset-0 bg-sage-dark/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4"
    >
      <div
        class="bg-ivory-light p-5 rounded-[1.5rem] shadow-2xl max-w-xs w-full relative flex flex-col max-h-[65vh] box-border overflow-hidden"
      >
        <div class="flex items-center justify-between mb-3">
          <h3
            id="daily-modal-title"
            class="text-[15px] font-black text-sage-dark truncate flex-1"
          ></h3>
          <button
            id="close-daily-modal"
            class="text-sage-dark hover:text-black p-1 shrink-0"
          >
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <div
          id="daily-modal-list"
          class="flex flex-col gap-2 overflow-y-auto hide-scroll flex-1 pb-1"
        >
          <!-- JS로 동적 생성 -->
        </div>
      </div>
    </div>

    <script>
      lucide.createIcons();

      const form = document.getElementById("todo-form");
      const taskInput = document.getElementById("task-input");
      const categoryRadios = document.getElementsByName("category");
      const datePickerWrapper = document.getElementById("date-picker-wrapper");
      const dueDateInput = document.getElementById("due-date");

      const tabList = document.getElementById("tab-list");
      const tabWeekly = document.getElementById("tab-weekly");
      const tabMonthly = document.getElementById("tab-monthly");
      const viewList = document.getElementById("view-list");
      const viewWeekly = document.getElementById("view-weekly");
      const viewMonthly = document.getElementById("view-monthly");
      const calendarMemos = document.getElementById("calendar-memos");

      let memoCategories = JSON.parse(
        localStorage.getItem("memoCategories"),
      ) || [
        { id: "want", title: "중요하지 않은 할 일 메모", icon: "heart" },
        { id: "must", title: "해야 하는 할 일 메모", icon: "check-circle-2" },
        {
          id: "trivial",
          title: "지금 하지 않아도 되는 할 일 메모",
          icon: "coffee",
        },
      ];
      let allMemos = JSON.parse(localStorage.getItem("allMemos")) || {};
      let currentActiveMemoKey = "";
      let isWeeklyViewActive = false;

      const dynamicMemos = document.getElementById("dynamic-memos");
      const memoTitle = document.getElementById("memo-title");
      const monthlyWeeklyMemos = document.getElementById(
        "monthly-weekly-memos",
      );
      const monthlyWeeklyList = document.getElementById("monthly-weekly-list");
      const addCatModal = document.getElementById("add-cat-modal");
      const closeCatModal = document.getElementById("close-cat-modal");
      const btnSaveCat = document.getElementById("btn-save-cat");
      const newCatInput = document.getElementById("new-cat-input");

      const dailyModal = document.getElementById("daily-modal");
      const closeDailyModalBtn = document.getElementById("close-daily-modal");
      const dailyModalTitle = document.getElementById("daily-modal-title");
      const dailyModalList = document.getElementById("daily-modal-list");
      let currentOpenModalDate = null;

      const goalContainer = document.getElementById("goal-container");
      const monthlyGoalInput = document.getElementById("monthly-goal-input");
      monthlyGoalInput.value = localStorage.getItem("monthlyGoal") || "";

      let currentMonthDate = new Date();
      const todayDateObj = new Date();
      let currentWeekStartDate = new Date(todayDateObj);
      currentWeekStartDate.setDate(
        todayDateObj.getDate() - todayDateObj.getDay(),
      );

      function setHeaderDateAndCheer() {
        const days = ["일", "월", "화", "수", "목", "금", "토"];
        const month = todayDateObj.getMonth() + 1;
        const date = todayDateObj.getDate();
        const dayName = days[todayDateObj.getDay()];

        const dateDisplay = document.getElementById("form-date-display");
        const cheerDisplay = document.getElementById("form-cheer-display");
        const cheerIcon = document.getElementById("form-cheer-icon");

        if (dateDisplay) {
          dateDisplay.textContent = `${month}월 ${date}일 ${dayName}요일`;
        }

        if (cheerDisplay) {
          const firstDayOfMonth = new Date(
            todayDateObj.getFullYear(),
            todayDateObj.getMonth(),
            1,
          );
          const firstDayWeekday = firstDayOfMonth.getDay();
          const weekNumber = Math.ceil((date + firstDayWeekday) / 7);
          const weekIndex = Math.min(weekNumber - 1, 3);

          const cheerMessages = [
            "새로운 한 달, 기분 좋게 시작해봐요!",
            "조금씩 꾸준히 나아가는 당신을 응원해요!",
            "잠시 숨 돌리고 다시 힘내볼까요?",
            "이번 달도 멋지게 채워가고 있어요!",
          ];
          cheerDisplay.textContent = cheerMessages[weekIndex];

          const shadowDef = `<defs><filter id="ss"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#6E8B67" flood-opacity="0.65"/></filter></defs>`;
          let svgContent = "";

          if (weekIndex === 0) {
            svgContent = `<svg width="18" height="18" viewBox="0 0 100 100">${shadowDef}<g filter="url(#ss)"><path d="M30,60 Q50,20 70,40 Q90,60 50,80 Q10,100 30,60 Z" fill="#D4B675"/></g></svg>`;
          } else if (weekIndex === 1) {
            svgContent = `<svg width="18" height="18" viewBox="0 0 100 100">${shadowDef}<g filter="url(#ss)"><path d="M 50 90 L 50 64" stroke="#6E8B67" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M 50 65 C 20 70 5 55 10 45 C 15 30 40 45 50 65 Z" fill="#84A37F"/><path d="M 50 65 C 80 70 95 55 90 45 C 85 30 60 45 50 65 Z" fill="#6E8B67"/></g></svg>`;
          } else if (weekIndex === 2) {
            svgContent = `<svg width="18" height="18" viewBox="0 0 100 100">${shadowDef}<g filter="url(#ss)"><path d="M 50 85 Q 45 60 50 50" stroke="#6E8B67" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M 50 60 Q 30 45 40 25 Q 50 10 60 25 Q 70 45 50 60 Z" fill="white"/></g></svg>`;
          } else {
            svgContent = `<svg width="18" height="18" viewBox="0 0 100 100">${shadowDef}<g filter="url(#ss)"><circle cx="50" cy="30" r="14" fill="white" /><circle cx="68" cy="43" r="14" fill="white" /><circle cx="61" cy="63" r="14" fill="white" /><circle cx="39" cy="63" r="14" fill="white" /><circle cx="32" cy="43" r="14" fill="white" /><circle cx="50" cy="48" r="10" fill="#FDE047"/></g></svg>`;
          }

          cheerIcon.innerHTML = svgContent;
        }
      }
      setHeaderDateAndCheer();

      const lists = {
        want: document.getElementById("list-want"),
        must: document.getElementById("list-must"),
        trivial: document.getElementById("list-trivial"),
      };

      let todos = JSON.parse(localStorage.getItem("todos")) || [];
      function toLocalDateStr(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }
      const todayStr = toLocalDateStr(new Date());
      dueDateInput.value = todayStr;

      monthlyGoalInput.addEventListener("input", () => {
        localStorage.setItem("monthlyGoal", monthlyGoalInput.value);
      });

      function switchTab(activeTab) {
        const tabs = [
          {
            el: tabList,
            view: viewList,
            showGoal: false,
            showMemo: false,
            isWeekly: false,
          },
          {
            el: tabWeekly,
            view: viewWeekly,
            showGoal: true,
            showMemo: true,
            isWeekly: true,
          },
          {
            el: tabMonthly,
            view: viewMonthly,
            showGoal: true,
            showMemo: true,
            isWeekly: false,
          },
        ];

        tabs.forEach((tab) => {
          if (tab.el === activeTab) {
            tab.el.className =
              "px-3.5 py-1.5 rounded-full text-[14px] font-extrabold bg-white text-sage-dark shadow-sm transition-all whitespace-nowrap";
            tab.view.classList.remove("hidden");
            isWeeklyViewActive = tab.isWeekly;

            if (tab.showGoal) goalContainer.classList.remove("hidden");
            else goalContainer.classList.add("hidden");

            if (tab.showMemo) {
              calendarMemos.classList.remove("hidden");
              calendarMemos.classList.add("flex");
              renderMemoUI();
            } else {
              calendarMemos.classList.add("hidden");
              calendarMemos.classList.remove("flex");
            }
          } else {
            tab.el.className =
              "px-3.5 py-1.5 rounded-full text-[14px] font-extrabold text-sage-dark hover:text-black transition-all whitespace-nowrap";
            tab.view.classList.add("hidden");
          }
        });
      }

      tabList.addEventListener("click", () => switchTab(tabList));
      tabWeekly.addEventListener("click", () => {
        switchTab(tabWeekly);
        renderWeeklyCalendar();
      });
      tabMonthly.addEventListener("click", () => {
        switchTab(tabMonthly);
        renderMonthlyCalendar();
      });

      function toggleCatModal(show) {
        if (show) {
          newCatInput.value = "";
          addCatModal.classList.remove("hidden");
          newCatInput.focus();
        } else {
          addCatModal.classList.add("hidden");
        }
      }
      closeCatModal.addEventListener("click", () => toggleCatModal(false));
      addCatModal.addEventListener("click", (e) => {
        if (e.target === addCatModal) toggleCatModal(false);
      });

      btnSaveCat.addEventListener("click", () => {
        const val = newCatInput.value.trim();
        if (!val) return;
        const newId = "cat_" + Date.now();
        memoCategories.push({ id: newId, title: val, icon: "bookmark" });
        localStorage.setItem("memoCategories", JSON.stringify(memoCategories));
        toggleCatModal(false);
        renderMemoUI();
      });

      function renderMemoUI() {
        if (calendarMemos.classList.contains("hidden")) return;

        dynamicMemos.innerHTML = "";

        if (isWeeklyViewActive) {
          const year = currentWeekStartDate.getFullYear();
          const month = String(currentWeekStartDate.getMonth() + 1).padStart(
            2,
            "0",
          );
          const day = String(currentWeekStartDate.getDate()).padStart(2, "0");
          currentActiveMemoKey = `week_${year}-${month}-${day}`;

          memoTitle.innerHTML = `<i data-lucide="pen-tool" class="w-3.5 h-3.5 inline-block mr-1 text-sage-dark align-middle" style="transform: translateY(-1px);"></i> 이번 주 메모 작성`;
          monthlyWeeklyMemos.classList.add("hidden");
        } else {
          const year = currentMonthDate.getFullYear();
          const month = String(currentMonthDate.getMonth() + 1).padStart(
            2,
            "0",
          );
          currentActiveMemoKey = `month_${year}-${month}`;

          memoTitle.innerHTML = `<i data-lucide="book" class="w-3.5 h-3.5 inline-block mr-1 text-sage-dark align-middle" style="transform: translateY(-1px);"></i> ${month}월 메모 작성`;
          monthlyWeeklyMemos.classList.remove("hidden");
          renderMonthlyWeeklyMemos();
        }

        const currentData = allMemos[currentActiveMemoKey] || {};

        memoCategories.forEach((cat) => {
          const box = document.createElement("div");
          box.className =
            "snap-center shrink-0 w-[85%] md:w-full bg-white/80 backdrop-blur-sm rounded-[1.5rem] p-3.5 shadow-sm border border-white flex flex-col gap-2 relative transition hover:-translate-y-0.5 hover:shadow-md";

          const deleteBtnHtml = cat.id.startsWith("cat_")
            ? `<button onclick="deleteCategory('${cat.id}')" class="text-sage-dark/40 hover:text-red-500 transition-colors p-1" title="카테고리 삭제"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>`
            : "";

          box.innerHTML = `
                    <div class="flex items-center justify-between">
                        <h4 class="text-[14px] font-black text-sage-dark flex items-center gap-1.5"><i data-lucide="${cat.icon}" class="w-3.5 h-3.5 text-sage-dark"></i> ${cat.title}</h4>
                        ${deleteBtnHtml}
                    </div>
                    <textarea data-cat="${cat.id}" class="memo-input w-full bg-transparent resize-none h-20 text-[13px] font-semibold text-sage-dark focus:outline-none placeholder-sage-dark/50" placeholder="자유롭게 기록을 남겨보세요.">${currentData[cat.id] || ""}</textarea>
                `;
          dynamicMemos.appendChild(box);
        });

        const addBtnBox = document.createElement("button");
        addBtnBox.onclick = () => toggleCatModal(true);
        addBtnBox.className =
          "snap-center shrink-0 w-[85%] md:w-full h-[120px] border border-dashed border-sage-light/50 rounded-[1.5rem] flex flex-col items-center justify-center text-sage-dark hover:bg-sage-light/15 hover:border-sage-dark transition-colors gap-1.5 shadow-sm";
        addBtnBox.innerHTML = `<div class="bg-white p-2 rounded-full shadow-sm"><i data-lucide="plus" class="w-3.5 h-3.5 text-sage-dark"></i></div> <span class="text-[14px] font-black text-sage-dark">카테고리 추가</span>`;
        dynamicMemos.appendChild(addBtnBox);

        lucide.createIcons();
      }

      function deleteCategory(catId) {
        memoCategories = memoCategories.filter((c) => c.id !== catId);
        localStorage.setItem("memoCategories", JSON.stringify(memoCategories));

        Object.keys(allMemos).forEach((key) => {
          if (allMemos[key][catId]) {
            delete allMemos[key][catId];
          }
        });
        localStorage.setItem("allMemos", JSON.stringify(allMemos));

        renderMemoUI();
      }

      dynamicMemos.addEventListener("input", (e) => {
        if (e.target.classList.contains("memo-input")) {
          const catId = e.target.dataset.cat;
          const val = e.target.value;
          const key = currentActiveMemoKey;

          if (!allMemos[key]) allMemos[key] = {};
          allMemos[key][catId] = val;
          localStorage.setItem("allMemos", JSON.stringify(allMemos));
        }
      });

      function renderMonthlyWeeklyMemos() {
        monthlyWeeklyList.innerHTML = "";

        const targetPrefix = `week_${currentMonthDate.getFullYear()}-${String(currentMonthDate.getMonth() + 1).padStart(2, "0")}`;
        const weeklyKeys = Object.keys(allMemos)
          .filter((k) => k.startsWith(targetPrefix))
          .sort();

        if (weeklyKeys.length === 0) {
          monthlyWeeklyList.innerHTML =
            '<div class="text-[13px] text-sage-dark/70 py-2.5 text-center font-bold bg-white/60 rounded-xl">이달에 작성된 주간 메모가 없습니다.</div>';
          return;
        }

        weeklyKeys.forEach((key) => {
          const data = allMemos[key];
          const [, datePart] = key.split("_");
          const dayMatch = datePart.split("-")[2];

          const card = document.createElement("div");
          card.className =
            "bg-white p-3 rounded-xl border border-sage-light/20 shadow-sm flex flex-col gap-1.5 transition hover:shadow-md";

          const weekLabel = document.createElement("div");
          weekLabel.className =
            "text-[13px] font-black text-sage-dark border-b border-sage-light/25 pb-1 mb-0.5";
          weekLabel.textContent = `📅 ${currentMonthDate.getMonth() + 1}월 ${dayMatch}일 시작 주차`;
          card.appendChild(weekLabel);

          let hasContent = false;
          memoCategories.forEach((cat) => {
            if (data[cat.id] && data[cat.id].trim() !== "") {
              hasContent = true;
              const item = document.createElement("div");
              item.className =
                "text-[13px] font-semibold text-sage-dark leading-relaxed";
              item.innerHTML = `<span class="font-black text-sage-dark text-[11px] mr-1 px-1.5 py-0.5 bg-sage-light/25 rounded-md">[${cat.title}]</span> ${data[cat.id].replace(/\n/g, "<br>")}`;
              card.appendChild(item);
            }
          });

          if (hasContent) monthlyWeeklyList.appendChild(card);
        });

        if (monthlyWeeklyList.children.length === 0) {
          monthlyWeeklyList.innerHTML =
            '<div class="text-[13px] text-sage-dark/70 py-2.5 text-center font-bold bg-white/60 rounded-xl">이달에 작성된 주간 메모가 없습니다.</div>';
        }
      }

      categoryRadios.forEach((radio) => {
        radio.addEventListener("change", (e) => {
          if (e.target.value === "want") {
            datePickerWrapper.classList.add("hidden");
            datePickerWrapper.classList.remove("flex");
          } else {
            datePickerWrapper.classList.remove("hidden");
            datePickerWrapper.classList.add("flex");
          }
        });
      });

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = taskInput.value.trim();
        if (!text) return;

        let category = "want";
        categoryRadios.forEach((r) => {
          if (r.checked) category = r.value;
        });
        const dueDate = category === "want" ? null : dueDateInput.value;

        const newTodo = {
          id: Date.now().toString(),
          text: text,
          category: category,
          dueDate: dueDate,
          completed: false,
          createdAt: new Date().toISOString(),
        };

        taskInput.value = "";
        todos.push(newTodo);
        localStorage.setItem("todos", JSON.stringify(todos));

        renderTodos();
        if (!viewWeekly.classList.contains("hidden")) renderWeeklyCalendar();
        if (!viewMonthly.classList.contains("hidden")) renderMonthlyCalendar();
      });

      function deleteTodo(id) {
        todos = todos.filter((t) => t.id !== id);
        localStorage.setItem("todos", JSON.stringify(todos));
        renderTodos();
        if (!viewWeekly.classList.contains("hidden")) renderWeeklyCalendar();
        if (!viewMonthly.classList.contains("hidden")) renderMonthlyCalendar();
        if (currentOpenModalDate && !dailyModal.classList.contains("hidden")) {
          openDailyModal(currentOpenModalDate);
        }
      }

      function toggleTodo(id) {
        const todo = todos.find((t) => t.id === id);
        if (!todo) return;
        todo.completed = !todo.completed;
        localStorage.setItem("todos", JSON.stringify(todos));
        renderTodos();
        if (!viewWeekly.classList.contains("hidden")) renderWeeklyCalendar();
        if (!viewMonthly.classList.contains("hidden")) renderMonthlyCalendar();
        if (currentOpenModalDate && !dailyModal.classList.contains("hidden")) {
          openDailyModal(currentOpenModalDate);
        }
      }

      function getDayOfWeek(dateString) {
        if (!dateString) return "";
        const days = ["일", "월", "화", "수", "목", "금", "토"];
        const date = new Date(dateString);
        return days[date.getDay()] + "요일";
      }

      function getDDayStatus(dateString) {
        if (!dateString) return null;
        const targetDate = new Date(dateString);
        targetDate.setHours(0, 0, 0, 0);
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const diffTime = targetDate - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays === 0) return { text: "D-Day", isUrgent: true };
        if (diffDays > 0)
          return { text: `D-${diffDays}`, isUrgent: diffDays <= 3 };
        return { text: `D+${Math.abs(diffDays)}`, isUrgent: true };
      }

      function renderTodos() {
        Object.values(lists).forEach((list) => (list.innerHTML = ""));

        todos.forEach((todo) => {
          const card = document.createElement("div");
          card.className = `task-card bg-white p-3 rounded-[1rem] flex flex-col gap-1 border border-sage-light/20 shadow-sm ${todo.completed ? "opacity-60" : "opacity-100"}`;

          const topRow = document.createElement("div");
          topRow.className = "flex items-start justify-between gap-2";

          const leftWrap = document.createElement("div");
          leftWrap.className = "flex items-start gap-2 flex-1 cursor-pointer";
          leftWrap.onclick = () => toggleTodo(todo.id);

          const checkIcon = document.createElement("div");
          checkIcon.className = `w-4.5 h-4.5 shrink-0 rounded-full border-2 flex items-center justify-center transition-colors mt-0.5
                    ${todo.completed ? "bg-sage border-sage text-white" : "border-sage-light text-transparent"}`;
          checkIcon.innerHTML = `<i data-lucide="check" class="w-3 h-3"></i>`;

          const textSpan = document.createElement("span");
          textSpan.className = `text-[14px] font-semibold leading-snug break-all ${todo.completed ? "line-through text-gray-400" : "text-sage-dark"}`;
          textSpan.textContent = todo.text;

          leftWrap.appendChild(checkIcon);
          leftWrap.appendChild(textSpan);

          const deleteBtn = document.createElement("button");
          deleteBtn.className =
            "text-sage-dark/40 hover:text-red-500 transition-colors p-1";
          deleteBtn.innerHTML = `<i data-lucide="trash-2" class="w-3.5 h-3.5"></i>`;
          deleteBtn.onclick = (e) => {
            e.stopPropagation();
            deleteTodo(todo.id);
          };

          topRow.appendChild(leftWrap);
          topRow.appendChild(deleteBtn);
          card.appendChild(topRow);

          if (todo.category !== "want" && todo.dueDate) {
            const dDayInfo = getDDayStatus(todo.dueDate);
            const dayOfWeek = getDayOfWeek(todo.dueDate);

            const metaRow = document.createElement("div");
            metaRow.className = "flex items-center gap-1.5 mt-0.5 pl-6.5";

            const dDayBadge = document.createElement("span");
            const badgeColors =
              todo.category !== "trivial" && dDayInfo.isUrgent
                ? "bg-orange-100 text-orange-800 font-black border border-orange-200"
                : todo.category === "trivial"
                  ? "bg-[#F4F8F3] text-sage-dark border border-sage-light/20 font-black"
                  : "bg-sage-light/25 text-sage-dark border border-transparent font-black";

            dDayBadge.className = `text-[11px] px-1.5 py-0.2 rounded-full tracking-wide ${badgeColors}`;
            dDayBadge.textContent = dDayInfo.text;

            const dateText = document.createElement("span");
            dateText.className = "text-[13px] text-sage-dark font-extrabold";
            const shortDate = todo.dueDate.split("-").slice(1).join("/");
            dateText.textContent = `${shortDate} (${dayOfWeek})`;

            metaRow.appendChild(dDayBadge);
            metaRow.appendChild(dateText);
            card.appendChild(metaRow);
          }

          if (lists[todo.category]) {
            lists[todo.category].appendChild(card);
          }
        });

        lucide.createIcons();

        Object.keys(lists).forEach((key) => {
          if (lists[key].children.length === 0) {
            const emptyMsg = document.createElement("div");
            emptyMsg.className =
              "text-center text-[14px] text-sage-dark/70 py-4 font-bold bg-white/60 rounded-[1rem] border border-dashed border-sage-light/35";
            emptyMsg.textContent = "항목이 없습니다.";
            lists[key].appendChild(emptyMsg);
          }
        });
      }

      function renderWeeklyCalendar() {
        const grid = document.getElementById("weekly-grid");
        const label = document.getElementById("current-week-label");
        grid.innerHTML = "";

        const startOfWeek = new Date(currentWeekStartDate);
        const midWeek = new Date(startOfWeek);
        midWeek.setDate(startOfWeek.getDate() + 3);
        label.textContent = `${midWeek.getFullYear()}년 ${midWeek.getMonth() + 1}월 주간 일정`;

        renderMemoUI();

        const daysName = ["일", "월", "화", "수", "목", "금", "토"];
        const emojiMap = { want: "💭", must: "🔥", trivial: "🍃" };

        for (let i = 0; i < 7; i++) {
          const currentDate = new Date(startOfWeek);
          currentDate.setDate(startOfWeek.getDate() + i);

          const year = currentDate.getFullYear();
          const month = String(currentDate.getMonth() + 1).padStart(2, "0");
          const day = String(currentDate.getDate()).padStart(2, "0");
          const dateStr = `${year}-${month}-${day}`;
          const isToday = dateStr === todayStr;

          const col = document.createElement("div");
          const colBg = isToday
            ? "bg-[#F7FAF6] border-[#DCEAD8]"
            : "bg-white border border-dashed border-sage-light/35";
          col.className = `flex flex-col gap-1 backdrop-blur-sm rounded-[1rem] p-2 shadow-none w-[92px] shrink-0 ${colBg}`;

          const header = document.createElement("div");
          let dayHeaderColor = "text-sage-dark font-black";
          if (i === 0) dayHeaderColor = "text-red-600 font-black";
          if (i === 6) dayHeaderColor = "text-blue-600 font-black";

          header.className = `text-center pb-1 border-b border-sage-light/20 flex flex-col items-center justify-center w-full ${dayHeaderColor}`;
          header.innerHTML = `<div class="text-[14px] text-center w-full">${daysName[i]}</div><div class="text-[12px] mt-0.5 text-center w-full">${currentDate.getDate()}일</div>`;
          col.appendChild(header);

          const dayTodos = todos.filter(
            (t) => t.dueDate === dateStr && t.category !== "want",
          );
          const contentArea = document.createElement("div");
          contentArea.className =
            "flex flex-col gap-1 min-h-[75px] max-h-[110px] overflow-y-auto hide-scroll";

          if (dayTodos.length === 0) {
            const empty = document.createElement("div");
            empty.className =
              "text-[11px] text-sage-dark/40 text-center py-2.5 font-bold";
            empty.textContent = "-";
            contentArea.appendChild(empty);
          } else {
            dayTodos.forEach((t) => {
              const item = document.createElement("div");
              const isUrgent =
                getDDayStatus(t.dueDate)?.isUrgent && t.category !== "trivial";
              const urgencyClass = t.completed
                ? "bg-gray-100 text-gray-400 line-through"
                : t.category === "trivial"
                  ? "bg-[#F4F8F3] text-sage-dark font-bold"
                  : isUrgent
                    ? "bg-orange-100 text-orange-800 font-bold"
                    : "bg-sage-light/20 text-sage-dark";
              const emoji = emojiMap[t.category] || "";
              item.className = `text-[11px] p-1 rounded font-bold truncate cursor-pointer flex items-center gap-1 ${urgencyClass}`;
              item.innerHTML = `<span>${emoji}</span><span class="truncate">${t.text}</span>`;
              item.title = `${emoji} ${t.text}`;
              item.onclick = () => toggleTodo(t.id);
              contentArea.appendChild(item);
            });
          }
          col.appendChild(contentArea);
          grid.appendChild(col);
        }
      }

      document.getElementById("prev-week").addEventListener("click", () => {
        currentWeekStartDate.setDate(currentWeekStartDate.getDate() - 7);
        renderWeeklyCalendar();
      });
      document.getElementById("next-week").addEventListener("click", () => {
        currentWeekStartDate.setDate(currentWeekStartDate.getDate() + 7);
        renderWeeklyCalendar();
      });

      function renderMonthlyCalendar() {
        const grid = document.getElementById("monthly-grid");
        const label = document.getElementById("current-month-label");
        grid.innerHTML = "";

        const year = currentMonthDate.getFullYear();
        const month = currentMonthDate.getMonth();
        label.textContent = `${year}년 ${month + 1}월`;

        renderMemoUI();

        const firstDayIndex = new Date(year, month, 1).getDay();
        const lastDay = new Date(year, month + 1, 0).getDate();
        const emojiMap = { want: "💭", must: "🔥", trivial: "🍃" };

        for (let i = 0; i < firstDayIndex; i++) {
          const emptyCell = document.createElement("div");
          emptyCell.className = "min-h-[88px] md:min-h-[98px] bg-transparent";
          grid.appendChild(emptyCell);
        }

        for (let d = 1; d <= lastDay; d++) {
          const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          const isToday = dateStr === todayStr;

          const cell = document.createElement("div");
          const cellBg = isToday
            ? "bg-[#F7FAF6] border-[#DCEAD8] shadow-sm"
            : "bg-white/90 border-sage-light/15 shadow-sm";
          cell.className = `min-h-[88px] md:min-h-[98px] backdrop-blur-sm rounded-xl p-1.5 border flex flex-col gap-1 overflow-hidden cursor-pointer hover:border-sage transition ${cellBg}`;

          const dayOfWeekIndex = new Date(year, month, d).getDay();

          let dayNumColor = "text-sage-dark";
          if (dayOfWeekIndex === 0) dayNumColor = "text-red-600";
          if (dayOfWeekIndex === 6) dayNumColor = "text-blue-600";

          const dayHeader = document.createElement("div");
          dayHeader.className = `text-[12px] font-black ${dayNumColor} px-0.5 shrink-0`;
          dayHeader.textContent = d;
          cell.appendChild(dayHeader);

          const dayTodos = todos.filter(
            (t) => t.dueDate === dateStr && t.category !== "want",
          );
          const badgeContainer = document.createElement("div");
          badgeContainer.className =
            "flex flex-col gap-0.5 overflow-hidden flex-1";

          dayTodos.slice(0, 2).forEach((t) => {
            const badge = document.createElement("div");
            const isUrgent =
              getDDayStatus(t.dueDate)?.isUrgent && t.category !== "trivial";
            const urgencyClass = t.completed
              ? "bg-gray-100 text-gray-400 line-through"
              : t.category === "trivial"
                ? "bg-[#F4F8F3] text-sage-dark font-bold"
                : isUrgent
                  ? "bg-orange-100 text-orange-800 font-bold"
                  : "bg-sage-light/20 text-sage-dark";
            const emoji = emojiMap[t.category] || "";
            badge.className = `text-[9px] px-1 py-0.5 rounded font-bold truncate flex items-center gap-0.5 shrink-0 ${urgencyClass}`;
            badge.innerHTML = `<span>${emoji}</span><span class="truncate">${t.text}</span>`;
            badgeContainer.appendChild(badge);
          });

          if (dayTodos.length > 2) {
            const moreBadge = document.createElement("div");
            moreBadge.className =
              "text-[9px] text-sage-dark/60 font-bold px-0.5 shrink-0";
            moreBadge.textContent = `+${dayTodos.length - 2}개`;
            badgeContainer.appendChild(moreBadge);
          }

          cell.appendChild(badgeContainer);
          cell.onclick = () => openDailyModal(dateStr);
          grid.appendChild(cell);
        }
      }

      document.getElementById("prev-month").addEventListener("click", () => {
        currentMonthDate.setMonth(currentMonthDate.getMonth() - 1);
        renderMonthlyCalendar();
      });
      document.getElementById("next-month").addEventListener("click", () => {
        currentMonthDate.setMonth(currentMonthDate.getMonth() + 1);
        renderMonthlyCalendar();
      });

      function openDailyModal(dateStr) {
        currentOpenModalDate = dateStr;
        const [y, m, d] = dateStr.split("-");
        dailyModalTitle.textContent = `${Number(m)}월 ${Number(d)}일 일정`;
        dailyModalList.innerHTML = "";

        const dayTodos = todos.filter(
          (t) => t.dueDate === dateStr && t.category !== "want",
        );
        const emojiMap = { want: "💭", must: "🔥", trivial: "🍃" };

        if (dayTodos.length === 0) {
          dailyModalList.innerHTML =
            '<div class="text-[13px] text-sage-dark/60 text-center py-4 font-bold">등록된 일정이 없습니다.</div>';
        } else {
          dayTodos.forEach((t) => {
            const item = document.createElement("div");
            const isUrgent =
              getDDayStatus(t.dueDate)?.isUrgent && t.category !== "trivial";
            const urgencyClass = t.completed
              ? "bg-gray-100 text-gray-400 line-through"
              : t.category === "trivial"
                ? "bg-[#F4F8F3] text-sage-dark font-bold"
                : isUrgent
                  ? "bg-orange-100 text-orange-800 font-bold"
                  : "bg-sage-light/20 text-sage-dark";
            const emoji = emojiMap[t.category] || "";

            item.className = `p-2 rounded-xl flex items-center justify-between gap-2 shadow-sm ${urgencyClass} cursor-pointer`;
            item.onclick = () => toggleTodo(t.id);

            const leftSpan = document.createElement("span");
            leftSpan.className =
              "text-[13px] font-bold flex-1 min-w-0 flex items-center gap-1.5 truncate";
            leftSpan.innerHTML = `<span>${emoji}</span><span class="truncate">${t.text}</span>`;

            const delBtn = document.createElement("button");
            delBtn.className =
              "text-sage-dark/50 hover:text-red-500 p-1 shrink-0";
            delBtn.innerHTML = `<i data-lucide="trash-2" class="w-3.5 h-3.5"></i>`;
            delBtn.onclick = (e) => {
              e.stopPropagation();
              deleteTodo(t.id);
            };

            item.appendChild(leftSpan);
            item.appendChild(delBtn);
            dailyModalList.appendChild(item);
          });
        }

        dailyModal.classList.remove("hidden");
        lucide.createIcons();
      }

      closeDailyModalBtn.addEventListener("click", () => {
        dailyModal.classList.add("hidden");
        currentOpenModalDate = null;
      });
      dailyModal.addEventListener("click", (e) => {
        if (e.target === dailyModal) {
          dailyModal.classList.add("hidden");
          currentOpenModalDate = null;
        }
      });

      switchTab(tabList);
      renderTodos();
    </script>
  </body>
</html>
